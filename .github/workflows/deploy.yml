name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          migration_output="$(npx wrangler d1 migrations apply chillmusic --remote 2>&1)"
          migration_status=$?
          printf '%s\n' "$migration_output"
          if [ "$migration_status" -ne 0 ]; then
            printf '### D1 migration failure\n\n```text\n%s\n```\n' "$migration_output" >> "$GITHUB_STEP_SUMMARY"
            exit "$migration_status"
          fi

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: cd dist/server && npx wrangler deploy
